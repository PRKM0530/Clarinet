{% extends "base.html" %}
{% block title %}Sign In{% endblock %}
{% block content %}
<div class="auth-card">
  <div class="auth-logo">🎵</div>
  <div class="auth-title">Sign in to Clarinet</div>
  <div class="auth-sub">Enter your credentials to access the dashboard.</div>

  {% if error %}
  <div style="background:var(--red-bg);border:1px solid rgba(239,68,68,.25);border-radius:var(--radius);padding:10px 14px;margin-bottom:18px;font-size:13px;color:#f87171;display:flex;align-items:center;gap:8px;">
    <i class="bi bi-exclamation-circle-fill"></i>{{ error }}
  </div>
  {% endif %}

  <form method="post" action="/login">
    <div class="form-group">
      <label class="form-label" for="username">Username</label>
      <input type="text" id="username" name="username" class="form-input"
             placeholder="Your username" autocomplete="username" autofocus required />
    </div>
    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <input type="password" id="password" name="password" class="form-input"
             placeholder="••••••••" autocomplete="current-password" required />
    </div>
    <button type="submit" class="btn btn-primary btn-lg" style="width:100%;margin-top:8px">
      <i class="bi bi-box-arrow-in-right"></i> Sign In
    </button>
  </form>
</div>
{% endblock %}
